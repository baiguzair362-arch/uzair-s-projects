<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Snake Game</title>
<style>
/* Reset & Body */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #4facfe, #00f2fe); padding: 20px; }

.game-container {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3); width: 90%; max-width: 500px;
}

h1 { color: #fff; margin-bottom: 20px; text-align: center; text-shadow: 2px 2px 5px #000; }
.scoreboard { color: #fff; font-size: 1.2rem; margin-bottom: 10px; }
#game-board {
    position: relative; width: 100%; padding-bottom: 100%; background: #111;
    border: 5px solid #fff; border-radius: 15px; overflow: hidden; margin-bottom: 15px;
}
.snake, .food {
    position: absolute; width: 20px; height: 20px; border-radius: 5px;
}
.snake { background: linear-gradient(45deg, #f9d423, #ff4e50); }
.food { background: linear-gradient(45deg, #00ff87, #60efff); }

.control-buttons {
    display: flex; flex-direction: column; align-items: center; margin: 15px 0;
}

.button-row {
    display: flex; justify-content: center; margin: 5px 0;
}

.action-buttons {
    display: flex; justify-content: center; gap: 10px; margin-top: 10px;
    flex-wrap: wrap;
}

button {
    padding: 10px 20px; border: none; border-radius: 10px; background: #fff; 
    font-size: 1rem; cursor: pointer; transition: all 0.3s; margin: 5px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2); min-width: 80px;
}
button:hover { background: #f0f0f0; transform: translateY(-2px); }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.direction-btn { 
    width: 70px; height: 70px; font-size: 1.5rem; font-weight: bold;
    background: linear-gradient(145deg, #4facfe, #00f2fe); color: white;
}
.direction-btn:hover { background: linear-gradient(145deg, #00f2fe, #4facfe); }

#stop-btn { background: linear-gradient(145deg, #ff416c, #ff4b2b); color: white; }
#resume-btn { background: linear-gradient(145deg, #00b09b, #96c93d); color: white; }
#start-btn { background: linear-gradient(145deg, #ff7e5f, #feb47b); color: white; }

.controls { margin-top: 10px; color: #fff; font-size: 0.9rem; text-align: center; }
.game-status { 
    margin-top: 10px; color: #fff; font-size: 1rem; 
    padding: 8px 15px; border-radius: 10px; background: rgba(0,0,0,0.2);
}
</style>
</head>
<body>
<div class="game-container">
    <h1>🐍 Enhanced Snake Game 🟩</h1>
    <div class="scoreboard">Score: <span id="score">0</span></div>
    <div id="game-board"></div>
    
    <div class="game-status" id="status">Ready to start</div>
    
    <div class="action-buttons">
        <button id="start-btn">Start Game</button>
        <button id="stop-btn" disabled>Stop</button>
        <button id="resume-btn" disabled>Resume</button>
    </div>
    
    <div class="control-buttons">
        <div class="button-row">
            <button class="direction-btn" id="up-btn">↑</button>
        </div>
        <div class="button-row">
            <button class="direction-btn" id="left-btn">←</button>
            <div style="width: 70px;"></div>
            <button class="direction-btn" id="right-btn">→</button>
        </div>
        <div class="button-row">
            <button class="direction-btn" id="down-btn">↓</button>
        </div>
    </div>
    
    <div class="controls">Use Arrow Keys or Buttons to Control</div>
</div>

<script>
const board = document.getElementById('game-board');
const scoreElement = document.getElementById('score');
const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');
const resumeBtn = document.getElementById('resume-btn');
const upBtn = document.getElementById('up-btn');
const downBtn = document.getElementById('down-btn');
const leftBtn = document.getElementById('left-btn');
const rightBtn = document.getElementById('right-btn');
const statusElement = document.getElementById('status');

const boardSize = 20; 
let snake, food, dx, dy, score, speed, gameInterval, gameRunning, isPaused;

// Initialize game variables
function initGame() {
    snake = [{ x: 10, y: 10 }];
    // Start moving right automatically
    dx = 1; 
    dy = 0;
    score = 0;
    speed = 150;
    gameRunning = true;
    isPaused = false;
    scoreElement.textContent = score;
    statusElement.textContent = "Game running";
    placeFood();
    updateBoard();
}

// Draw snake and food
function updateBoard() {
    board.innerHTML = '';
    snake.forEach(segment => {
        const s = document.createElement('div');
        s.style.left = segment.x * (100 / boardSize) + '%';
        s.style.top = segment.y * (100 / boardSize) + '%';
        s.classList.add('snake');
        board.appendChild(s);
    });
    const f = document.createElement('div');
    f.style.left = food.x * (100 / boardSize) + '%';
    f.style.top = food.y * (100 / boardSize) + '%';
    f.classList.add('food');
    board.appendChild(f);
}

// Random food position
function placeFood() {
    do {
        food = { x: Math.floor(Math.random()*boardSize), y: Math.floor(Math.random()*boardSize) };
    } while(snake.some(s => s.x === food.x && s.y === food.y));
}

// Move snake
function moveSnake() {
    if (isPaused || !gameRunning) return;
    
    const head = { 
        x: (snake[0].x + dx + boardSize) % boardSize, 
        y: (snake[0].y + dy + boardSize) % boardSize 
    };
    
    // Check collision with self
    if(snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
    }
    
    snake.unshift(head);
    
    // Check if food is eaten
    if(head.x === food.x && head.y === food.y) {
        score++; 
        scoreElement.textContent = score;
        placeFood();
        // Increase speed slightly with score
        if (score % 5 === 0 && speed > 80) {
            speed -= 10;
            clearInterval(gameInterval);
            gameInterval = setInterval(moveSnake, speed);
        }
    } else {
        snake.pop();
    }
    
    updateBoard();
}

// Game over function
function gameOver() {
    clearInterval(gameInterval);
    gameRunning = false;
    statusElement.textContent = `Game Over! Score: ${score}`;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    resumeBtn.disabled = true;
    alert(`Game Over! Your score: ${score}`);
}

// Direction control functions
function goUp() {
    if (dy === 0 && gameRunning && !isPaused) {
        dx = 0; 
        dy = -1;
    }
}

function goDown() {
    if (dy === 0 && gameRunning && !isPaused) {
        dx = 0; 
        dy = 1;
    }
}

function goLeft() {
    if (dx === 0 && gameRunning && !isPaused) {
        dx = -1; 
        dy = 0;
    }
}

function goRight() {
    if (dx === 0 && gameRunning && !isPaused) {
        dx = 1; 
        dy = 0;
    }
}

// Stop the game
function stopGame() {
    if (gameRunning && !isPaused) {
        isPaused = true;
        statusElement.textContent = "Game paused";
        stopBtn.disabled = true;
        resumeBtn.disabled = false;
    }
}

// Resume the game
function resumeGame() {
    if (gameRunning && isPaused) {
        isPaused = false;
        statusElement.textContent = "Game running";
        stopBtn.disabled = false;
        resumeBtn.disabled = true;
    }
}

// Keyboard controls
document.addEventListener('keydown', e => {
    if (!gameRunning || isPaused) return;
    
    switch(e.key){
        case 'ArrowUp': goUp(); break;
        case 'ArrowDown': goDown(); break;
        case 'ArrowLeft': goLeft(); break;
        case 'ArrowRight': goRight(); break;
        case ' ': // Space bar to pause/resume
            if (isPaused) {
                resumeGame();
            } else {
                stopGame();
            }
            break;
    }
});

// Button event listeners
startBtn.addEventListener('click', () => {
    initGame();
    startBtn.disabled = true;
    stopBtn.disabled = false;
    resumeBtn.disabled = true;
    
    clearInterval(gameInterval);
    gameInterval = setInterval(moveSnake, speed);
});

stopBtn.addEventListener('click', stopGame);
resumeBtn.addEventListener('click', resumeGame);

upBtn.addEventListener('click', goUp);
downBtn.addEventListener('click', goDown);
leftBtn.addEventListener('click', goLeft);
rightBtn.addEventListener('click', goRight);

// Initialize the game
initGame();
startBtn.disabled = false;
stopBtn.disabled = true;
resumeBtn.disabled = true;
statusElement.textContent = "Click Start Game to begin";
</script>
</body>
</html>
